<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocol Cheat Sheet — V10</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#faf8f4;--white:#fff;--border:#e4e0d8;--border-light:#f4f0e8;--text:#2a2824;--text-mid:#4a4540;--text-muted:#8a7f70;--green-dark:#2d4a28;--green-mid:#4a7a42;--green-light:#e8f0e5;--green-border:#b8d4b0;--amber:#b87a1a;--amber-light:#fdf3e0;--amber-border:#e8c878;--rose:#a83050;--rose-light:#fdf0f3;--rose-border:#e8b0c0;--blue-dark:#2a4a6a;--blue-light:#eef4fb;--blue-border:#b8cfe8;--purple:#6a4082;--purple-light:#f5eeff;--purple-border:#c8b0f0;--topbar-h:54px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--text);line-height:1.65;font-size:14px}
h1,h2,h3{font-family:'Lora',Georgia,serif;font-weight:500}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* TOPBAR */
#topbar{position:fixed;top:0;left:0;right:0;z-index:300;height:var(--topbar-h);background:var(--green-dark);display:flex;align-items:center;padding:0 18px;border-bottom:2px solid #1a3018}
.logo-link{display:flex;align-items:center;gap:7px;text-decoration:none;flex-shrink:0;cursor:pointer;padding:0 4px}
.logo{font-family:'Lora',serif;font-size:14px;font-weight:600;color:#e8f4e4;white-space:nowrap}
.logo-mobile{display:none;font-family:'Lora',serif;font-size:14px;font-weight:600;color:#e8f4e4;white-space:nowrap}
.logo-chevron{display:none;font-size:9px;color:#a8d4a0;margin-left:2px;transition:transform .2s}
.logo-link.open .logo-chevron{transform:rotate(180deg)}
.sat-links{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
.sat-link{font-family:'DM Sans',sans-serif;font-size:10.5px;font-weight:500;padding:4px 11px;border-radius:20px;text-decoration:none;color:#c8e8c0;border:1px solid rgba(255,255,255,.18);transition:all .15s;white-space:nowrap}
.sat-link:hover{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
#mobile-dropdown{display:none;position:fixed;top:var(--topbar-h);left:0;right:0;z-index:299;background:var(--green-dark);border-bottom:2px solid #1a3018;padding:8px 16px 12px;flex-direction:column;gap:4px}
#mobile-dropdown.open{display:flex}
#mobile-dropdown a{color:#c8e8c0;border:1px solid rgba(255,255,255,.15);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;padding:10px 16px;border-radius:8px;text-decoration:none;text-align:center;transition:background .12s}
#mobile-dropdown a:hover{background:rgba(255,255,255,.18);color:#fff}
@media(max-width:680px){.logo{display:none}.logo-mobile{display:block}.logo-chevron{display:block}.sat-links{display:none}}

/* PAGE */
.page{margin-top:var(--topbar-h);padding:20px 18px 60px;max-width:980px;margin-left:auto;margin-right:auto}

/* CONTROLS */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin-bottom:18px;padding:14px 16px;background:var(--white);border:1px solid var(--border);border-radius:12px}
.ctrl-group{display:flex;flex-direction:column;gap:5px}
.ctrl-label{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.ctrl-pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:500;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--white);color:var(--text-mid);cursor:pointer;transition:all .12s;white-space:nowrap}
.pill:hover{border-color:var(--green-mid);color:var(--green-dark)}
.pill.sel-ph{background:var(--green-dark);color:#fff;border-color:var(--green-dark)}
.pill.sel-g{background:#edf7ec;color:#2d6a28;border-color:#8bc88a;font-weight:600}
.pill.sel-y{background:#fdf8e8;color:#8a6800;border-color:#e8c848;font-weight:600}
.pill.sel-r{background:#fdf0f0;color:#a03030;border-color:#e88080;font-weight:600}
.day-tab{font-size:12px;font-weight:500;padding:5px 15px;border-radius:20px;border:1px solid var(--border);background:var(--white);color:var(--text-mid);cursor:pointer;transition:all .12s}
.day-tab.active{background:var(--green-mid);color:#fff;border-color:var(--green-mid)}

/* MODE BANNER */
.mode-banner{border-radius:10px;padding:10px 15px;margin-bottom:16px;font-size:13px;font-weight:500;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.mb-g{background:#edf7ec;border:1.5px solid #8bc88a;color:#2d6a28}
.mb-y{background:#fdf8e8;border:1.5px solid #e8c848;color:#8a6800}
.mb-r{background:#fdf0f0;border:1.5px solid #e88080;color:#a03030}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}}

/* CARDS */
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px}
.card-head{padding:9px 15px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.card-head h3{font-family:'DM Sans',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.ch-green .card-head{background:var(--green-light);border-bottom-color:var(--green-border)}.ch-green .card-head h3{color:var(--green-dark)}
.ch-purple .card-head{background:var(--purple-light);border-bottom-color:var(--purple-border)}.ch-purple .card-head h3{color:var(--purple)}
.ch-blue .card-head{background:var(--blue-light);border-bottom-color:var(--blue-border)}.ch-blue .card-head h3{color:var(--blue-dark)}

/* GLANCE ROWS */
.gr{display:flex;gap:10px;padding:7px 15px;border-bottom:1px solid var(--border-light);font-size:12.5px}
.gr:last-child{border-bottom:none}
.gl{color:var(--text-muted);min-width:108px;flex-shrink:0;font-size:11.5px}
.gv{color:var(--text-mid);flex:1;font-weight:500;line-height:1.4}

/* SCHEDULE ROWS */
.sr{display:flex;gap:10px;padding:5px 15px;border-bottom:1px solid var(--border-light);font-size:12.5px;align-items:baseline}
.sr:last-child{border-bottom:none}
.st{color:var(--text-muted);font-size:10.5px;font-family:'DM Mono',monospace;white-space:nowrap;min-width:56px;flex-shrink:0}
.sa{color:var(--text-mid);flex:1;line-height:1.4}
.sa strong{color:var(--text)}

/* SUPPLEMENT STACK — 3 COLUMN */
.tb-block{border-bottom:1px solid var(--border-light)}
.tb-block:last-child{border-bottom:none}
.tb-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);padding:6px 15px 3px;background:var(--border-light);border-bottom:1px solid var(--border-light)}
.ess-head{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 15px 3px;background:var(--green-light);color:var(--green-dark);border-bottom:1px solid var(--green-border)}
.cond-sep{height:1px;background:var(--border);margin:0 15px}
.spice-note{padding:5px 15px;font-size:11.5px;color:var(--amber);background:var(--amber-light);border-bottom:1px solid var(--amber-border);font-family:'DM Mono',monospace}
.sup-r{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;padding:5px 15px;border-bottom:1px solid var(--border-light);font-size:12px;align-items:baseline}
.sup-r:last-child{border-bottom:none}
.sn{font-weight:500;color:var(--text)}
.sd{color:var(--text-muted);font-family:'DM Mono',monospace;font-size:10px;white-space:nowrap;text-align:right}
.sw{color:var(--green-mid);font-family:'DM Mono',monospace;font-size:10px;white-space:nowrap;text-align:right}
.sw.pulse{color:var(--blue-dark)}
.sw.cond{color:var(--amber)}

/* PAUSE ALERT */
.pause-alert{background:var(--amber-light);border:1px solid var(--amber-border);border-radius:8px;padding:9px 13px;font-size:12.5px;color:#7a5010;margin-bottom:12px;line-height:1.5;display:none}
.pause-alert strong{color:#6a4000}

/* LOOKUP */
.lookup-body{padding:11px 15px}
#li{width:100%;padding:7px 11px;border:1px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:var(--cream);outline:none}
#li:focus{border-color:var(--green-mid);background:var(--white)}
#lr{margin-top:9px}
.li{padding:6px 9px;border-radius:6px;font-size:12.5px;color:var(--text-mid);cursor:pointer;margin-bottom:3px;transition:background .1s}
.li:hover{background:var(--green-light);color:var(--green-dark)}
.li .lk{font-weight:600;color:var(--text)}
.li .lv{color:var(--text-muted);font-size:11px;display:block;margin-top:1px}
</style>
</head>

{k:'Melatonin',v:'0.5mg bedtime. Phase 1 Weeks 1–6 only. Low dose equally effective as high dose for sleep onset. Taper by halving over 1–2 weeks, then stop. Tart cherry takes over post-taper.'},

{k:'Morning Ground',v:'Homemade wake blend: creatine + Celtic salt + cream of tartar + Mg malate + ascorbic acid + malic acid + dextrose + xylitol + monk fruit. One heaping tbsp (~12g) in 400–500ml water. Better mineral profile than Liquid IV. Batch: ~336g fits in pint mason jar; makes 30 servings. Shelf-stable 60+ days.'},
{k:'L. reuteri',v:'1–2 tabs chewed, before brushing. Stimulates oxytocin via vagal signaling. Sequence: chew tablet → let sit 3–5 min → then brush with Sensodyne. Stannous fluoride in Sensodyne is antibacterial — preserve colonization benefit.'},
{k:'D3/K2',v:'2000–5000 IU D3 + 100mcg K2 MK-7. With fat-containing food (smoothie nut butter handles this). D3 always taken. Skip K2 component on natto days (10g natto = 100mcg K2 MK-7). Reduce D3 if UV-exposed shiitake or midday Hawaii sun.'},
{k:'B-complex',v:'1 cap methylated (confirm methylfolate + methylcobalamin on label). With smoothie. Morning only — energizing effect interferes with sleep.'},
{k:'B12',v:'1000mcg sublingual methylcobalamin. Dissolve simultaneously with NMN before smoothie. Essential on plant-forward diet — no reliable food equivalent at therapeutic dose.'},

{k:'Berberine',v:'500mg Phase 5+. Non-training days only, 3×/week. AMPK activation, blood sugar regulation. Not on resistance training days — may blunt anabolic signaling.'},
{k:'Niacin flush',v:'100–200mg at 10am, 30 min after microdose. Must produce flush (warmth, redness 30–60 min) — non-flush/niacinamide does not work. Phase 3+.'},
{k:'Microdosing',v:'Psilocybin 0.1–0.15g Mon–Thu 10am. Weigh every dose on 0.001g scale. Niacin flush 30 min after. Pause 1 week before macrodose or MDMA. Resume Day 4–5 after integration.'},
{k:'Spice parcel',v:'Blate pape square with turmeric + pippali (long pepper) + black cumin + ginger. Swallow whole with first bite of lunch. Fat in meal handles curcumin bioavailability — without fat + piperine, absorption is under 1%. Pre-make Sunday: 7 parcels for the week.'},
{k:'Dulse',v:'Atlantic dulse only (Maine Coast Sea Vegetables). Iodine ~75–150mcg per ¼ tsp. Sprinkle on savory food (salads, grain bowls, miso soup). Faint ocean/umami note. Pacific seaweed has radioactive iodine concerns post-2011.'},
{k:'Blackstrap molasses powder',v:'1 tsp in morning smoothie. Copper ~0.1mg/tsp (offsets zinc-depletion risk from zinc picolinate), iron ~2mg, calcium ~50mg. Unsulphured blackstrap only.'},
{k:'Tart cherry',v:'1 tbsp in warm water, 30–60 min before sleep. After melatonin taper (Weeks 4–6), ongoing. Only significant dietary melatonin source. Also: anthocyanins, quercetin, training recovery.'},
{k:'5-HTP',v:'100mg post-MDMA sessions only. With EGCG 400mg. Begin 24h after MDMA, 3 days only. Not after psilocybin — different serotonin dynamics. MDMA-specific serotonin replenishment.'},
{k:'HeartMath',v:'Inner Balance ear clip. Always Free Session (Quick Coherence) mode — never guided (narrator is a trigger). Always through headphones. 6 breaths/min (5s in, 5s out) + genuinely felt positive emotion. Emotion is what creates coherence — breathing alone is insufficient. Phase 5+: occasional check-in, not daily obligation.'},
{k:'tVNS',v:'Nuropod earclip, left ear cymba concha. 25Hz, 200–300µs, 0.5–1.0mA. No sensation should be felt. Start 2–3 min before CC. Run throughout. Not during MDMA sessions.'},
{k:'tDCS',v:'F3 anodal + right supraorbital. 1.5–2.0mA, 20 min immediately before CC. Not within 5h of sleep (~4:30pm cutoff). Not within 24h of macrodose or MDMA.'},
{k:'SSP',v:'Safe and Sound Protocol. Unyte-iLs licensed provider, 5h total. Headphones only. No standalone CC on SSP days. Phase 1 Mo 2 primary course + Phase 4 Days 7–14 mandatory refresher.'},
{k:'SGB',v:'Stellate Ganglion Block — Dual Sympathetic Reset. Right then left, 24–72h apart. Ultrasound guidance non-negotiable. Phase 0 + Phase 4 opening. Horner\'s syndrome (eyelid droop, pupil constriction) is expected and temporary — confirms effectiveness.'},
{k:'Propranolol',v:'10–20mg, 60–90 min before CC. Phase 3 second half + Phase 4 Wks 2–3. Requires physician prescription. Not within 48h of macrodose or MDMA. Not for asthma or low baseline HR.'},
{k:'Kava',v:'Noble kava only — not instant, not extract, not tudei. 2–4 tbsp medium-grind in strainer bag, 2 cups room-temp water, knead 5–10 min. Drink full preparation. Take 45–60 min before. Max 3×/week. No alcohol, no macrodose/MDMA days.'},
{k:'Yoga Nidra',v:'Every evening, never skip. Ph1–2: 20 min. Ph3: 30–35 min. Ph4+: 40–45 min. Night waking: put on 20-min sleep track immediately, don\'t check phone or light. The recovery from disruption during open awareness is the training.'},
{k:'Somatic release',v:'Ph1: simplified 7–10 min morning. Ph3+: full sequence 10–15 min morning + 20–25 min pre-CC. Constructive rest + psoas release + hip circles + shoulder/neck + diaphragmatic reset. Full instructions on Exercises page.'},
{k:'Qi-Gong',v:'15 min daily from Phase 1 Week 4. Shaking 3–5 min (breaks overnight somatic bracing) + flowing 10 min. Full instructions on Exercises page.'},
{k:'CC',v:'Counterconditioning. Entry condition: SUDs 0–2, body tension below 4/10, resonance breathing established. Technique 1: priming (2–3 min) → dual exposure (trigger + positive music, 70/30 ratio) → recovery → rest. 4–6 reps. Green days only.'},
{k:'EMDR',v:'2–3×/wk post-CC Phase 3+. Bilateral audio tones ~1Hz, alternating L/R. Targets interpersonal trigger memories. Self-directed appropriate for SUDs 4–7. Never start with highest-charge material.'},
{k:'IFS',v:'Internal Family Systems. 1–2×/wk self-directed Phase 3+. Bring to mind trigger or reactivity. Ask the protector: "What are you trying to protect me from?" and "What are you afraid would happen if you didn\'t react?" Write immediately after.'},
{k:'ACT',v:'Daily 2–3 min: prefix trigger thoughts with "I notice I am having the thought that…" Values-based action weekly. The Happiness Trap by Russ Harris.'},
{k:'Physiological sigh',v:'Double inhale through nose (sniff, top it off) + long complete exhale through mouth. Fastest manual autonomic reset. Use in-moment after any trigger.'},
{k:'Tactical Brake',v:'Activate if 3+ warning signs (sleep poor 3+ nights, CC consistently backfiring, rising rumination, resentment toward protocol). Min 48h. No CC, no macrodosing, no EMDR. Double support layer.'},
{k:'The Pulse',v:'72h post-session = highest neuroplasticity window. Day 1 rest. Days 2–7: daily CC with tVNS (+ tDCS from Phase 3). Sleep on those nights consolidates what many ordinary nights combined would. Governs every integration week.'},
{k:'A-MISO-S',v:'Misophonia severity questionnaire. Track monthly from Phase 0 baseline. 25% reduction = Phase 2 benchmark. Most meaningful outcome measure alongside the avoidance inventory.'},
{k:'SUDs',v:'Subjective Units of Distress 0–10. Re-rate full hierarchy every Sunday. CC advance criterion: 4 consecutive reps at SUDs ≤2 across multiple sessions → move one level up hierarchy.'},
{k:'Meeting support',v:'Bone conduction headphones (Shokz OpenRun Pro 2) + pink noise at barely audible volume. Prevents thalamic gain increase from near-silence. Use at all meetings, meals, and any trigger-likely context.'},
{k:'Mouth taping',v:'Pending trial. When ready: 3M Micropore tape vertically over center of lips. Trial 1–2 weeks. If improves sleep depth, continue. If discomfort or anxiety, discontinue.'},

  var cs={0:'var(--purple)',1:'var(--green-mid)',2:'var(--blue-dark)',3:'var(--amber)',4:'var(--rose)',5:'var(--purple)'};
  var bg={0:'var(--purple-light)',1:'var(--green-light)',2:'var(--blue-light)',3:'var(--amber-light)',4:'var(--rose-light)',5:'var(--purple-light)'};
  var br={0:'var(--purple-border)',1:'var(--green-border)',2:'var(--blue-border)',3:'var(--amber-border)',4:'var(--rose-border)',5:'var(--purple-border)'};
  var h='<div class="card-head" style="background:'+bg[p]+';border-bottom:1px solid '+br[p]+'"><h3 style="color:'+cs[p]+'">'+d.s+' — '+d.n+'</h3></div><div>';
  d.g.forEach(function(r){h+='<div class="gr"><span class="gl">'+r[0]+'</span><span class="gv">'+r[1]+'</span></div>';});
  h+='</div>';
  document.getElementById('gc').innerHTML=h;
}

function rS(p,day){
  var d=PH[p];
  var rows=day==='t'?d.t:d.a;
  document.getElementById('sh').textContent=day==='t'?'Training Day Schedule':'Aerobic / Waterfall Day Schedule';
  var h='';
  rows.forEach(function(r){h+='<div class="sr"><span class="st">'+r[0]+'</span><span class="sa">'+r[1]+'</span></div>';});
  document.getElementById('sb').innerHTML=h;
}

function rSP(p){
  var data=SP[p];
  var h='';
  Object.keys(data).forEach(function(win){
    h+='<div class="tb-block"><div class="tb-lbl">'+win+'</div>';
    // Add spice parcel note for lunch window
    if(win.indexOf('Lunch')!==-1 && p>=1){
      h+='<div class="spice-note">⬆ Spice parcel (blate pape): turmeric + pippali + black cumin + ginger → with first bite</div>';
    }
    var items=data[win];
    var ess=items.filter(function(i){return i[3];});
    var cond=items.filter(function(i){return !i[3];});
    // Render essential items
    if(ess.length){
      h+='<div class="ess-head">Essential</div>';
      ess.forEach(function(r){
        var wc=r[2].indexOf('Mon–Fri')!==-1?'pulse':'';
        h+='<div class="sup-r"><span class="sn">'+r[0]+'</span><span class="sd">'+r[1]+'</span><span class="sw '+wc+'">'+r[2]+'</span></div>';
      });
    }
    // Divider + conditional items
    if(cond.length){
      if(ess.length) h+='<div class="cond-sep"></div>';
      cond.forEach(function(r){
        var wc=r[2].indexOf('Mon–Fri')!==-1||r[2].indexOf('non-training')!==-1?'cond':'';
        h+='<div class="sup-r"><span class="sn">'+r[0]+'</span><span class="sd">'+r[1]+'</span><span class="sw '+wc+'">'+r[2]+'</span></div>';
      });
    }
    h+='</div>';
  });
  document.getElementById('stb').innerHTML=h;
}

function rPA(p){
  var el=document.getElementById('pa');
  if(PH[p].pa){
    el.innerHTML='<strong>⚑ Pause rules — Phase '+p+':</strong> '+PH[p].pa;
    el.style.display='block';
  } else {
    el.style.display='none';
  }
}

function rMB(m){
  var el=document.getElementById('mb');
  var te=document.getElementById('mt');
  el.className='mode-banner';
  if(m==='g'){el.classList.add('mb-g');te.textContent='Green — Full protocol. Active rewiring available.';}
  else if(m==='y'){el.classList.add('mb-y');te.textContent='Yellow — Support day. No CC, no hierarchy work, no deliberate exposure. Full supplement + support layer.';}
  else{el.classList.add('mb-r');te.textContent='Red — Tactical Brake. All active rewiring suspended. Minimum 48h. Double support layer. No CC, no macrodosing, no EMDR.';}
}

function sP(p){
  S.p=p;
  document.querySelectorAll('#pp .pill').forEach(function(b,i){b.classList.toggle('sel-ph',i===p);});
  rG(p);rS(p,S.d);rSP(p);rPA(p);
}

function sM(m){
  S.m=m;
  document.querySelectorAll('#mp .pill').forEach(function(b){b.classList.remove('sel-g','sel-y','sel-r');});
  var cls={'g':'sel-g','y':'sel-y','r':'sel-r'};
  document.querySelectorAll('#mp .pill')[['g','y','r'].indexOf(m)].classList.add(cls[m]);
  rMB(m);
}

function sD(d){
  S.d=d;
  document.getElementById('tt').classList.toggle('active',d==='t');
  document.getElementById('at').classList.toggle('active',d==='a');
  rS(S.p,d);
}

function dL(q){
  var el=document.getElementById('lr');
  if(!q.trim()){el.innerHTML='';return;}
  var ql=q.toLowerCase();
  var res=LDB.filter(function(i){return i.k.toLowerCase().includes(ql)||i.v.toLowerCase().includes(ql);}).slice(0,6);
  if(!res.length){el.innerHTML='<div style="font-size:12px;color:var(--text-muted);padding:4px 0">No results</div>';return;}
  el.innerHTML=res.map(function(r){return'<div class="li"><span class="lk">'+r.k+'</span><span class="lv">'+r.v+'</span></div>';}).join('');
}

// Default to Phase 0 on load
window.addEventListener('DOMContentLoaded',function(){
  rG(0);rS(0,'t');rSP(0);rPA(0);rMB('g');
});
</script>

<script>
(function(){
  var toggle=document.getElementById('mobile-menu-toggle');
  var dropdown=document.getElementById('mobile-dropdown');
  if(!toggle||!dropdown)return;
  toggle.addEventListener('click',function(e){
    if(window.innerWidth>680)return;
    e.preventDefault();e.stopPropagation();
    var open=dropdown.classList.toggle('open');
    toggle.classList.toggle('open',open);
  });
  document.addEventListener('click',function(){
    dropdown.classList.remove('open');
    toggle.classList.remove('open');
  });
  dropdown.addEventListener('click',function(e){e.stopPropagation();});
})();
</script>
</body>
</html>

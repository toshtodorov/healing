<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misophonia Protocol</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Lora',Georgia,serif;
  background:#f5f2ee;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:24px;
}
.buttons{
  display:flex;
  flex-direction:column;
  gap:16px;
  width:100%;
  max-width:280px;
}
.btn{
  display:block;
  padding:18px 40px;
  text-align:center;
  text-decoration:none;
  font-size:16px;
  font-weight:400;
  letter-spacing:.08em;
  color:#2d4a28;
  background:transparent;
  border:1px solid #b8c8b0;
  border-radius:4px;
  transition:all .2s ease;
}
.btn:hover{
  background:#2d4a28;
  color:#f0f5ee;
  border-color:#2d4a28;
}
</style>
</head>
<body>
<div class="buttons">
  <a href="practice.html" class="btn">The Practice</a>
  <a href="protocol.html" class="btn">Protocol</a>
</div>
</body>
</html>
